<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCE6F0">
<title>Daily log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1F3B;
    --ink-soft: #1B1F3B99;
    --fog: #DCE6F0;
    --sage: #D6E4CF;
    --lilac: #E3DAF1;
    --sand: #F3DFC1;
    --blue: #2F4BFF;
    --white: #ffffff;
    --head: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--fog); color: var(--ink); font-family: var(--body); font-size: 17px; }
  body { overflow: hidden; transition: background .3s; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  #pager {
    display: flex; height: 100dvh; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  #pager::-webkit-scrollbar { display: none; }
  section {
    flex: 0 0 100%; width: 100%; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
    overflow-y: auto; padding: max(28px, env(safe-area-inset-top)) 22px 110px;
  }
  .inner { max-width: 520px; margin: 0 auto; }
  #p-home { background: var(--fog); }
  #p-log { background: var(--sage); }
  #p-history { background: var(--lilac); }
  #p-totals { background: var(--sand); }

  h1 { font-family: var(--head); font-weight: 700; font-size: 2.6rem; line-height: 1.02; letter-spacing: -0.02em; }
  h2 { font-family: var(--head); font-weight: 700; font-size: 1.9rem; line-height: 1.05; letter-spacing: -0.015em; }
  .sub { color: var(--ink-soft); margin-top: 6px; }
  .gap { height: 26px; }

  /* Home */
  .today-list { margin-top: 22px; display: grid; gap: 8px; }
  .today-item { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; background: var(--ink); color: var(--fog); border-radius: 14px; }
  .today-item b { font-family: var(--head); font-size: 1.3rem; }
  .empty { margin-top: 22px; padding: 22px 18px; border: 2px dashed var(--ink-soft); border-radius: 14px; }
  .empty p { margin-bottom: 14px; }
  .btn { display: inline-block; background: var(--blue); color: #fff; font-weight: 600; padding: 13px 20px; border-radius: 12px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 11px 18px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .wk { aspect-ratio: 1 / 1.25; border-radius: 12px; border: 2px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 600; }
  .wk small { font-weight: 500; font-size: .72rem; color: var(--ink-soft); }
  .wk.has { background: var(--ink); color: var(--fog); }
  .wk.has small { color: #DCE6F0aa; }
  .wk.now { outline: 3px solid var(--blue); outline-offset: 2px; }
  .wk-title { margin-top: 34px; font-weight: 600; }

  /* Log */
  .daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .daynav button.arrow { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); font-size: 1.3rem; line-height: 1; }
  .daynav .mid { text-align: center; flex: 1; padding: 0 8px; }
  .backtoday { margin-top: 6px; color: var(--blue); font-weight: 600; text-decoration: underline; }
  .list { margin-top: 20px; display: grid; gap: 7px; }
  .list .sp { height: 10px; }
  .row { width: 100%; display: flex; align-items: center; justify-content: space-between; text-align: left; padding: 0 8px 0 16px; min-height: 54px; border-radius: 14px; background: rgba(255,255,255,.65); border: 2px solid transparent; transition: background .12s, transform .08s; user-select: none; }
  .row:active { transform: scale(.985); }
  .row.on { background: var(--ink); color: #fff; }
  .row .nm { font-weight: 500; }
  .row .ctl { display: flex; align-items: center; gap: 4px; }
  .row .ct { font-family: var(--head); font-weight: 700; font-size: 1.25rem; min-width: 2ch; text-align: center; }
  .row .minus { width: 42px; height: 42px; border-radius: 50%; font-size: 1.4rem; line-height: 1; background: #ffffff22; }
  .row .plus { width: 42px; text-align: center; font-size: 1.4rem; color: var(--ink-soft); }
  .row.on .plus { color: #fff; }
  .custom { margin-top: 22px; padding-top: 20px; border-top: 2px solid var(--ink); }
  .custom label { font-weight: 600; display: block; margin-bottom: 8px; }
  .custom .f { display: flex; gap: 8px; }
  .custom input { flex: 1; min-width: 0; font: inherit; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { padding: 8px 13px; border-radius: 99px; border: 2px solid var(--ink); font-size: .92rem; }

  /* History */
  .mhead { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .mhead button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); font-size: 1.3rem; line-height: 1; }
  .mhead span { font-family: var(--head); font-weight: 700; font-size: 1.4rem; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .dow { margin-top: 16px; text-align: center; font-size: .8rem; color: var(--ink-soft); font-weight: 600; }
  .grid { margin-top: 6px; }
  .cell { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 500; background: rgba(255,255,255,.55); }
  .cell.blank { background: none; pointer-events: none; }
  .cell.has { background: var(--ink); color: #fff; }
  .cell.now { outline: 3px solid var(--blue); outline-offset: 1px; }
  .cell small { font-size: .68rem; opacity: .75; }
  .legend { margin-top: 16px; font-size: .92rem; color: var(--ink-soft); }

  /* Totals */
  .seg { display: flex; gap: 8px; margin-top: 18px; }
  .seg button { padding: 10px 16px; border-radius: 99px; border: 2px solid var(--ink); font-weight: 600; }
  .seg button.on { background: var(--ink); color: #fff; }
  .bars { margin-top: 22px; display: grid; gap: 14px; }
  .bar .top { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 500; }
  .bar .top span:last-child { color: var(--ink-soft); font-size: .92rem; }
  .bar .track { height: 14px; background: rgba(255,255,255,.6); border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--ink); border-radius: 99px; }
  .data { margin-top: 38px; padding-top: 20px; border-top: 2px solid var(--ink); }
  .data p { color: var(--ink-soft); font-size: .92rem; margin: 6px 0 14px; }
  .data .btns { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Tabs */
  nav { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 2px; padding: 5px; background: var(--ink); border-radius: 99px; z-index: 5; }
  nav button { padding: 10px 15px; border-radius: 99px; color: #ffffffbb; font-weight: 500; font-size: .95rem; }
  nav button.on { background: #fff; color: var(--ink); font-weight: 600; }

  .toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -80px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 9; transition: transform .25s; }
  .toast.show { transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div id="pager">
  <section id="p-home"><div class="inner" id="home"></div></section>
  <section id="p-log"><div class="inner" id="log"></div></section>
  <section id="p-history"><div class="inner" id="history"></div></section>
  <section id="p-totals"><div class="inner" id="totals"></div></section>
</div>

<nav aria-label="Pages" id="tabs">
  <button data-i="0">Home</button>
  <button data-i="1">Log</button>
  <button data-i="2">History</button>
  <button data-i="3">Totals</button>
</nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const SUBSTANCES = [
  "Ketamine", "Cocaine", null,
  "Weed (bong)", "Weed (joint)", "Weed (edible)", null,
  "Acid", "Shrooms", "DMT", "Molly", null,
  "Alcohol (wine/liquor)", "Alcohol (beer/ciders/seltzers)", null,
  "Nicotine (vape)", "Nicotine (pouch)", "Nicotine (cigarettes)"
];
const PRESET = SUBSTANCES.filter(Boolean);
const KEY = "daily-log-v1";

let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast("Couldn't save. Is private browsing on?"); } };

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = () => ymd(new Date());

let sel = todayStr();
let viewMonth = new Date(); viewMonth.setDate(1);
let range = 30;

const $ = id => document.getElementById(id);
const pager = $("pager");
const dayTotal = s => Object.values(data[s] || {}).reduce((a, b) => a + b, 0);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}

function go(i) { pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" }); }

function change(name, delta) {
  const day = data[sel] || (data[sel] = {});
  const n = (day[name] || 0) + delta;
  if (n <= 0) delete day[name]; else day[name] = n;
  if (!Object.keys(day).length) delete data[sel];
  save(); renderAll();
}

/* ---------- Home ---------- */
function renderHome() {
  const now = new Date(), t = todayStr(), items = Object.entries(data[t] || {});
  const dateLine = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  let h = `<h1>${esc(dateLine)}</h1>`;
  if (items.length) {
    h += `<p class="sub">Logged today</p><div class="today-list">` +
      items.map(([n, c]) => `<div class="today-item"><span>${esc(n)}</span><b>×${c}</b></div>`).join("") + `</div>
      <div class="gap"></div><button class="btn ghost" data-go="1" data-date="${t}">Edit today</button>`;
  } else {
    h += `<div class="empty"><p>Nothing logged yet today.</p><button class="btn" data-go="1" data-date="${t}">Log something</button></div>`;
  }
  h += `<p class="wk-title">This week</p><div class="week">`;
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i); const s = ymd(d);
    h += `<button class="wk ${dayTotal(s) ? "has" : ""} ${i === 0 ? "now" : ""}" data-go="1" data-date="${s}" aria-label="${s}">
      <span>${d.getDate()}</span><small>${d.toLocaleDateString(undefined, { weekday: "short" })}</small></button>`;
  }
  h += `</div>`;
  $("home").innerHTML = h;
}

/* ---------- Log ---------- */
function renderLog() {
  const d = parse(sel), isToday = sel === todayStr(), day = data[sel] || {};
  const title = isToday ? "Today" : d.toLocaleDateString(undefined, { weekday: "long" });
  const sub = d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  let h = `<div class="daynav">
    <button class="arrow" data-step="-1" aria-label="Previous day">‹</button>
    <div class="mid"><h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p></div>
    <button class="arrow" data-step="1" aria-label="Next day">›</button></div>`;
  if (!isToday) h += `<div style="text-align:center"><button class="backtoday" data-date="${todayStr()}">Back to today</button></div>`;

  const customs = Object.keys(day).filter(n => !PRESET.includes(n));
  const row = n => {
    const c = day[n] || 0;
    return `<div class="row ${c ? "on" : ""}" role="button" tabindex="0" data-add="${esc(n)}">
      <span class="nm">${esc(n)}</span>
      <span class="ctl">${c ? `<button class="minus" data-sub="${esc(n)}" aria-label="Remove one ${esc(n)}">−</button><span class="ct">${c}</span>` : ""}<span class="plus">+</span></span></div>`;
  };
  h += `<div class="list">` + SUBSTANCES.map(n => n === null ? `<div class="sp"></div>` : row(n)).join("") +
    (customs.length ? `<div class="sp"></div>` + customs.map(row).join("") : "") + `</div>`;

  const recent = [...new Set(Object.values(data).flatMap(x => Object.keys(x)).filter(n => !PRESET.includes(n)))].filter(n => !customs.includes(n));
  h += `<div class="custom"><label for="cust">Something else</label>
    <div class="f"><input id="cust" maxlength="40" placeholder="Type what you used" autocomplete="off"><button class="btn" id="custAdd">Add</button></div>` +
    (recent.length ? `<div class="chips">${recent.map(n => `<button class="chip" data-add="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : "") + `</div>`;
  const keep = document.activeElement && document.activeElement.id === "cust" ? $("cust").value : null;
  $("log").innerHTML = h;
  if (keep !== null) { $("cust").value = keep; $("cust").focus(); }
}

function addCustom() {
  const inp = $("cust"), v = inp.value.trim();
  if (!v) { toast("Type a name first"); return; }
  const match = PRESET.find(p => p.toLowerCase() === v.toLowerCase());
  inp.value = ""; inp.blur();
  change(match || v, 1);
}

/* ---------- History ---------- */
function renderHistory() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  let h = `<h2>History</h2><p class="sub">Tap a day to view or edit it.</p>
    <div class="mhead"><button data-month="-1" aria-label="Previous month">‹</button>
    <span>${first.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</span>
    <button data-month="1" aria-label="Next month">›</button></div>
    <div class="dow">${["S", "M", "T", "W", "T", "F", "S"].map(x => `<span>${x}</span>`).join("")}</div><div class="grid">`;
  for (let i = 0; i < first.getDay(); i++) h += `<div class="cell blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const s = `${y}-${pad(m + 1)}-${pad(d)}`, n = Object.keys(data[s] || {}).length;
    h += `<button class="cell ${n ? "has" : ""} ${s === todayStr() ? "now" : ""}" data-go="1" data-date="${s}">
      <span>${d}</span>${n ? `<small>${n} ${n === 1 ? "item" : "items"}</small>` : ""}</button>`;
  }
  h += `</div><p class="legend">Filled days have something logged.</p>`;
  $("history").innerHTML = h;
}

/* ---------- Totals ---------- */
function renderTotals() {
  const cutoff = new Date(); cutoff.setHours(0, 0, 0, 0);
  if (range) cutoff.setDate(cutoff.getDate() - range + 1);
  const tot = {}, daysUsed = {};
  for (const [s, items] of Object.entries(data)) {
    if (range && parse(s) < cutoff) continue;
    for (const [n, c] of Object.entries(items)) { tot[n] = (tot[n] || 0) + c; daysUsed[n] = (daysUsed[n] || 0) + 1; }
  }
  const rows = Object.entries(tot).sort((a, b) => b[1] - a[1]);
  const max = rows.length ? rows[0][1] : 1;
  const label = range ? `Last ${range} days` : "All time";
  let h = `<h2>Totals</h2><p class="sub">${label}</p>
    <div class="seg">${[[7, "7 days"], [30, "30 days"], [0, "All time"]].map(([r, l]) => `<button class="${range === r ? "on" : ""}" data-range="${r}">${l}</button>`).join("")}</div>`;
  h += rows.length
    ? `<div class="bars">${rows.map(([n, c]) => `<div class="bar"><div class="top"><span>${esc(n)}</span><span>${c} total · ${daysUsed[n]} ${daysUsed[n] === 1 ? "day" : "days"}</span></div>
        <div class="track"><div class="fill" style="width:${Math.max(4, c / max * 100)}%"></div></div></div>`).join("")}</div>`
    : `<div class="empty"><p>No entries in this range yet.</p></div>`;
  h += `<div class="data"><b>Your data</b><p>Everything is saved only in this browser. Export a backup now and then.</p>
    <div class="btns"><button class="btn ghost" id="exp">Export backup</button><button class="btn ghost" id="imp">Import backup</button></div></div>`;
  $("totals").innerHTML = h;
}

function renderAll() { renderHome(); renderLog(); renderHistory(); renderTotals(); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const sub = t.closest("[data-sub]"); if (sub) { e.stopPropagation(); change(sub.dataset.sub, -1); return; }
  const add = t.closest("[data-add]"); if (add) { change(add.dataset.add, 1); return; }
  const tab = t.closest("#tabs button"); if (tab) { go(+tab.dataset.i); return; }
  const step = t.closest("[data-step]");
  if (step) { const d = parse(sel); d.setDate(d.getDate() + +step.dataset.step); sel = ymd(d); renderLog(); return; }
  const dg = t.closest("[data-date]");
  if (dg) { sel = dg.dataset.date; renderLog(); if (dg.dataset.go) go(1); return; }
  const mo = t.closest("[data-month]");
  if (mo) { viewMonth.setMonth(viewMonth.getMonth() + +mo.dataset.month); renderHistory(); return; }
  const rg = t.closest("[data-range]"); if (rg) { range = +rg.dataset.range; renderTotals(); return; }
  if (t.closest("#custAdd")) { addCustom(); return; }
  if (t.closest("#exp")) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    a.download = `daily-log-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if (t.closest("#imp")) $("importFile").click();
});

document.addEventListener("keydown", e => {
  if (e.target.id === "cust" && e.key === "Enter") { addCustom(); return; }
  if (e.target.matches(".row") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); change(e.target.dataset.add, 1); return; }
  if (e.target.tagName === "INPUT") return;
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  if (e.key === "ArrowRight" && i < 3) go(i + 1);
  if (e.key === "ArrowLeft" && i > 0) go(i - 1);
});

$("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (typeof obj !== "object" || Array.isArray(obj)) throw 0;
      if (!confirm("Replace your current data with this backup?")) return;
      data = obj; save(); renderAll(); toast("Backup imported");
    } catch (_) { toast("That file isn't a valid backup"); }
  };
  r.readAsText(f); e.target.value = "";
});

const bgs = ["#DCE6F0", "#D6E4CF", "#E3DAF1", "#F3DFC1"];
function syncTab() {
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  document.querySelectorAll("#tabs button").forEach((b, k) => b.classList.toggle("on", k === i));
  document.querySelector('meta[name="theme-color"]').content = bgs[i];
}
pager.addEventListener("scroll", () => requestAnimationFrame(syncTab), { passive: true });

renderAll(); syncTab();
</script>
</body>
</html>
